# Builds the React app and publishes it to GitHub Pages on every push to main.
# The API runs on PythonAnywhere; set the repo variable API_BASE if its address
# differs from the default below (Settings → Secrets and variables → Actions → Variables).
name: Deploy frontend to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          FP_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.API_BASE || 'https://ethanmiclat.pythonanywhere.com' }}
      # Pages has no rewrites: an unknown path like /accounts serves 404.html, so make
      # that the app too and the router takes it from there.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
